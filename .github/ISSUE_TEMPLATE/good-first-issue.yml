name: Good first issue
description: Small docs or contributor-kit work suitable for a first contribution
title: "[Good first issue]: "
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: Keep this scoped to small docs or contributor work. Do not expand product scope. Never include API keys, private soliloquies, or restricted experiment files.
  - type: textarea
    id: task
    attributes:
      label: What needs doing?
      description: Describe the small docs or contributor-kit change.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files or docs to touch
      description: Point at specific files (for example under docs/ or .github/) when you know them.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: List the smallest checks that mean this issue is complete.
    validations:
      required: true
